appId: ai.sideaudio.agent
productName: Side Audio Bot
electronVersion: 43.2.0
asar: true
npmRebuild: false
asarUnpack:
  - node_modules/sherpa-onnx/**/*.wasm
  # open-computer-use is spawned by external backend Agent processes (plain
  # node + native runtimes), which cannot read files inside the asar archive.
  - node_modules/@qwen-code/open-computer-use/**/*
extraMetadata:
  main: desktop/src/main.mjs

directories:
  output: dist/desktop

# 更新元数据（latest-mac.yml）指向 GitHub Releases，由 electron-updater
# 在运行时发现新版本；CI 发布时随 dmg 与 blockmap 一并上传。
publish:
  - provider: github
    owner: SideAudio
    repo: side-audio-bot

files:
  - desktop/src/**/*
  - desktop/build/icon.png
  - desktop/build/trayTemplate*.png
  - server/src/**/*
  - shared/**/*
  - web/dist/**/*
  - package.json
  - LICENSE
  - NOTICE
  - THIRD_PARTY_NOTICES.md

extraResources:
  - from: scripts
    to: runtime/scripts
    filter:
      - "**/*"
  - from: config
    to: runtime/config
    filter:
      - "**/*"

mac:
  category: public.app-category.productivity
  icon: desktop/build/icon.icns
  hardenedRuntime: true
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.inherit.plist
  notarize: true
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Side Audio Bot 需要使用麦克风进行实时语音对话。
  target:
    - dmg
    - zip
  artifactName: side-audio-bot-${version}-mac-${arch}.${ext}

linux:
  # 官方 Release 只发布 macOS 产物；Linux 用户可用 npm run desktop:build:linux
  # 自行打包。AppImage/deb 无需代码签名证书即可本地安装运行。
  icon: desktop/build/icon.png
  category: Utility
  syncDesktopName: true
  target:
    - AppImage
    - deb
  artifactName: side-audio-bot-${version}-linux-${arch}.${ext}

win:
  icon: desktop/build/icon.png
  target:
    - nsis
  artifactName: side-audio-bot-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

dmg:
  title: Side Audio Bot
  backgroundColor: "#f5f6f7"
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 190
    - x: 390
      y: 190
      type: link
      path: /Applications
