# 品牌层漂移检测：上游合并进 dev 后，验证规则/overlay 仍完整覆盖。
# 纯 Node 脚本，无需安装依赖。
name: brand-check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/brand/check.mjs
